<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Vivero El Bosque</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #f7f9f7;
        }

      
        header {
            background-color: #0a5737;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #a8e6cf;
        }

       
        .login-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .login-box {
            background: white;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .login-box h1 {
            color: #0a5737;
            font-size: 1.9rem;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0a5737;
        }

        .btn-enviar {
            width: 100%;
            background-color: #0a5737;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-enviar:hover {
            background-color: #084529;
        }

       
        footer {
            background-color: #0a5737;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 80px;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <!-- Navegación -->
    <header>
        <a href="index.html" class="logo">Vivero </a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contact.html">Contacto</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

  
    <div class="login-container">
        <div class="login-box">
            <h1>Iniciar Sesión</h1>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-enviar">Ingresar</button>
            </form>
        </div>
    </div>


    <footer>
        © 2026 Vivero — Cultivamos con amor
    </footer>

</body>

</html>
